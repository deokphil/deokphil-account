{% extends "base.html" %}

{% block content %}
<div class="form-card" style="--accent: {{ group.theme_color }};">
    <h2>{{ group.name }}</h2>
    <p class="meta-line" style="text-align:center;">이름과 PIN을 입력하세요</p>

    {% if error %}
        <p class="error-msg">{{ error }}</p>
    {% endif %}

    <form method="post" action="/member/login">
        <input type="hidden" name="group_id" value="{{ group.id }}">

        <label>이름</label>
        <input type="text" name="name" required autofocus>

        <label>PIN (4자리)</label>
        <input type="password" name="pin" maxlength="4" pattern="[0-9]{4}" required>

        <button type="submit">로그인</button>
    </form>
    <p class="back-link"><a href="/member/login">← 그룹 다시 선택</a></p>
</div>
{% endblock %}
